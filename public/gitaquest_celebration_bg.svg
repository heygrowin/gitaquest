<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nightAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1B3B2E" />
      <stop offset="60%" stop-color="#0E2118" />
      <stop offset="100%" stop-color="#07130D" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#D4A359" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#D4A359" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07130D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Night Forest Canvas -->
  <rect width="600" height="800" fill="url(#nightAura)" />
  <circle cx="300" cy="180" r="260" fill="url(#goldGlow)" />

  <!-- Subtle golden stardust / sparkles -->
  <g fill="#F3DCA7">
    <circle cx="90" cy="120" r="1.5" opacity="0.6" />
    <circle cx="150" cy="80" r="1.8" opacity="0.7" />
    <circle cx="240" cy="140" r="1.2" opacity="0.5" />
    <circle cx="360" cy="110" r="1.6" opacity="0.6" />
    <circle cx="480" cy="95" r="1.8" opacity="0.75" />
    <circle cx="530" cy="160" r="1.3" opacity="0.5" />
    <circle cx="80" cy="240" r="1.5" opacity="0.6" />
    <circle cx="510" cy="260" r="1.5" opacity="0.65" />
    <circle cx="160" cy="320" r="1.3" opacity="0.45" />
    <circle cx="440" cy="340" r="1.4" opacity="0.5" />

    <!-- 4-point star sparkles -->
    <path d="M120,180 L122,185 L127,187 L122,189 L120,194 L118,189 L113,187 L118,185 Z" opacity="0.55" />
    <path d="M470,210 L472,214 L476,215 L472,216 L470,220 L468,216 L464,215 L468,214 Z" opacity="0.55" />
    <path d="M300,70 L301.5,74 L305.5,75 L301.5,76 L300,80 L298.5,76 L294.5,75 L298.5,74 Z" opacity="0.7" />
  </g>

  <!-- Distant Hill Silhouettes at base -->
  <path d="M0,800 Q150,680 300,740 T600,700 L600,800 Z" fill="#0A1811" opacity="0.8" />
  <path d="M0,800 Q200,730 400,770 T600,750 L600,800 Z" fill="#060F0B" />
</svg>
